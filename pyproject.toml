[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-forever-helper"
version = "0.1.0"
description = "Explicit user-command accessibility input for World of Warcraft"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
chat = ["websocket-client>=1.8,<2"]

[project.scripts]
wow-helper = "wow_helper.__main__:main"

[tool.setuptools.packages.find]
include = ["wow_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
